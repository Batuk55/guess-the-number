<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Guess The Number</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>


    <main class="game-container">

        <div class="game-card" id="game-card">


            <!-- Game icon -->

            <div class="game-icon" id="game-icon">
                🎯
            </div>


            <!-- Heading -->

            <h1 id="game-title">
                Guess The Number
            </h1>


            <p class="subtitle">

                I'm thinking of a number between

                <strong>1 and 50</strong>

            </p>


            <!-- Score section -->

            <div class="stats">

                <div class="stat-box">

                    <span>
                        ATTEMPTS
                    </span>

                    <strong id="attempts">
                        0
                    </strong>

                </div>


                <div class="stat-box">

                    <span>
                        BEST SCORE
                    </span>

                    <strong id="best-score">
                        -
                    </strong>

                </div>

            </div>


            <!-- Input -->

            <div class="input-section">

                <label for="guess">
                    Enter your guess
                </label>


                <input
                    type="number"
                    id="guess"
                    min="1"
                    max="50"
                    placeholder="1 - 50"
                    autocomplete="off"
                >


                <button
                    id="guess-button"
                    type="button"
                >

                    GUESS

                </button>

            </div>


            <!-- Game message -->

            <div
                id="message"
                class="message"
            >

                Make your first guess!

            </div>


            <!-- New game -->

            <button
                id="new-game-button"
                class="new-game-button"
                type="button"
            >

                ↻ NEW GAME

            </button>


            <!-- Hint -->

            <p class="hint">
                Press <strong>Enter</strong> to guess
            </p>


        </div>

    </main>


    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
